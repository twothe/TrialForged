#Vertical offset for the cast/charge bar, in pixels. Positive values move up.
# Default: 0
# Range: -512 ~ 512
castBarOffsetY = 0
#Scale for the cast/charge bar HUD (0.75–1.25).
# Default: 1.0
# Range: 0.75 ~ 1.25
